<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <!-- Schéma 1 : effet domino d'un groupe dynamique memberOf figé au 03/11/2026 -->
  <defs>
    <style>
      .bg { fill: #ede6d6; }
      .section { font: 600 22px 'Segoe UI', Arial, sans-serif; letter-spacing: 4px; fill: #b8972a; text-anchor: middle; }
      .rule { stroke: #b8972a; stroke-width: 2; }
      .block-navy { fill: #1a2b5e; }
      .block-gold { fill: #b8972a; }
      .block-bordeaux { fill: #8b1a2b; }
      .block-royal { fill: #2748c4; }
      .block-green { fill: #1a5c3a; }
      .band { fill: #d6d1c6; stroke: #8a8578; stroke-width: 2; stroke-dasharray: 10 6; }
      .title-w { font: 700 32px Georgia, 'Times New Roman', serif; fill: #ffffff; text-anchor: middle; }
      .title-wl { font: 700 38px Georgia, 'Times New Roman', serif; fill: #ffffff; text-anchor: middle; }
      .body-w { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .small-w { font: italic 400 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; fill-opacity: 0.9; text-anchor: middle; }
      .mono-w { font: 700 30px Consolas, 'Courier New', monospace; fill: #ffffff; text-anchor: middle; }
      .band-n { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #1a2b5e; text-anchor: middle; }
      .band-b { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #8b1a2b; text-anchor: middle; }
      .arrow { stroke: #1a2b5e; stroke-width: 8; fill: none; }
      .arrow-broken { stroke: #1a2b5e; stroke-opacity: 0.55; stroke-width: 8; fill: none; stroke-dasharray: 16 12; }
      .arrow-head { fill: #1a2b5e; }
      .arrow-head-b { fill: #1a2b5e; fill-opacity: 0.55; }
      .legend { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #1a2b5e; }
      .legend-b { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #8b1a2b; }
      .divider-w { stroke: #ffffff; stroke-opacity: 0.35; stroke-width: 2; }
      .cross { stroke: #8b1a2b; stroke-width: 7; stroke-linecap: round; }
    </style>
    <marker id="head" markerWidth="5" markerHeight="5" refX="2.5" refY="1" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,0 L2.5,4 Z" class="arrow-head"/>
    </marker>
    <marker id="headb" markerWidth="5" markerHeight="5" refX="2.5" refY="1" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,0 L2.5,4 Z" class="arrow-head-b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="960"/>

  <!-- Bandeaux de colonnes -->
  <line class="rule" x1="80" y1="72" x2="140" y2="72"/>
  <text class="section" x="270" y="80">SOURCES</text>
  <line class="rule" x1="400" y1="72" x2="460" y2="72"/>

  <line class="rule" x1="600" y1="72" x2="640" y2="72"/>
  <text class="section" x="800" y="80">OBJET FIGÉ</text>
  <line class="rule" x1="960" y1="72" x2="1000" y2="72"/>

  <line class="rule" x1="1140" y1="72" x2="1170" y2="72"/>
  <text class="section" x="1330" y="80">DÉPENDANCES</text>
  <line class="rule" x1="1490" y1="72" x2="1520" y2="72"/>

  <!-- Groupes sources -->
  <rect class="block-navy" x="80" y="200" width="380" height="140" rx="4"/>
  <text class="title-w" x="270" y="260">Groupe source A</text>
  <text class="small-w" x="270" y="302">Cité dans la règle</text>

  <rect class="block-navy" x="80" y="380" width="380" height="140" rx="4"/>
  <text class="title-w" x="270" y="440">Groupe source B</text>
  <text class="small-w" x="270" y="482">Cité dans la règle</text>

  <!-- Bandeau gris : mises à jour non répercutées -->
  <rect class="band" x="80" y="570" width="380" height="170" rx="4"/>
  <text class="band-n" x="270" y="625">Arrivées et départs</text>
  <text class="band-n" x="270" y="663">après le 3/11 :</text>
  <text class="band-b" x="270" y="706">non répercutés</text>

  <!-- Flèches sources vers groupe figé (interrompues) -->
  <line class="arrow-broken" x1="460" y1="270" x2="580" y2="400" marker-end="url(#headb)"/>
  <line class="arrow-broken" x1="460" y1="450" x2="580" y2="520" marker-end="url(#headb)"/>
  <line class="cross" x1="505" y1="315" x2="533" y2="343"/>
  <line class="cross" x1="533" y1="315" x2="505" y2="343"/>
  <line class="cross" x1="512" y1="466" x2="540" y2="494"/>
  <line class="cross" x1="540" y1="466" x2="512" y2="494"/>

  <!-- Bloc central bordeaux -->
  <rect class="block-bordeaux" x="600" y="300" width="400" height="350" rx="4"/>
  <text class="title-wl" x="800" y="375">Groupe</text>
  <text class="title-wl" x="800" y="420">dynamique</text>
  <text class="mono-w" x="800" y="470">memberOf</text>
  <line class="divider-w" x1="630" y1="505" x2="970" y2="505"/>
  <text class="body-w" x="800" y="550">Figé au</text>
  <text class="title-w" x="800" y="595">03/11/2026</text>

  <!-- Flèches vers dépendances -->
  <line class="arrow" x1="1000" y1="380" x2="1118" y2="215" marker-end="url(#head)"/>
  <line class="arrow" x1="1000" y1="445" x2="1116" y2="390" marker-end="url(#head)"/>
  <line class="arrow" x1="1000" y1="510" x2="1116" y2="560" marker-end="url(#head)"/>
  <line class="arrow" x1="1000" y1="575" x2="1118" y2="735" marker-end="url(#head)"/>

  <!-- Dépendances -->
  <rect class="block-royal" x="1140" y="120" width="380" height="150" rx="4"/>
  <text class="title-w" x="1330" y="182">Accès conditionnel</text>
  <text class="body-w" x="1330" y="226">Inclusion · exclusion</text>

  <rect class="block-gold" x="1140" y="300" width="380" height="150" rx="4"/>
  <text class="title-w" x="1330" y="362">Licences</text>
  <text class="body-w" x="1330" y="406">Attribution par groupe</text>

  <rect class="block-green" x="1140" y="480" width="380" height="150" rx="4"/>
  <text class="title-w" x="1330" y="530">Intune</text>
  <text class="body-w" x="1330" y="570">Anneaux de mise à jour</text>
  <text class="body-w" x="1330" y="604">Applications · profils</text>

  <rect class="block-navy" x="1140" y="660" width="380" height="150" rx="4"/>
  <text class="title-w" x="1330" y="722">Packages d'accès</text>
  <text class="body-w" x="1330" y="766">Unités administratives</text>

  <!-- Légende -->
  <line class="rule" x1="80" y1="860" x2="1520" y2="860"/>
  <rect class="block-bordeaux" x="80" y="887" width="28" height="28" rx="3"/>
  <text class="legend" x="122" y="909">Objet figé</text>
  <line class="arrow" x1="320" y1="901" x2="390" y2="901"/>
  <text class="legend" x="405" y="909">Dépendances qui continuent de s'appliquer</text>
  <line class="arrow-broken" x1="930" y1="901" x2="1010" y2="901"/>
  <text class="legend" x="1025" y="909">Mise à jour interrompue</text>
</svg>
