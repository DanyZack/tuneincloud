<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <!-- Schéma 1 : architecture de la passerelle réseau devant Microsoft 365 (rapport préliminaire du 15/11/2026) -->
  <defs>
    <style>
      .bg { fill: #ede6d6; }
      .section { font: 600 22px 'Segoe UI', Arial, sans-serif; letter-spacing: 4px; fill: #b8972a; text-anchor: middle; }
      .rule { stroke: #b8972a; stroke-width: 2; }
      .block-navy { fill: #1a2b5e; }
      .block-gold { fill: #b8972a; }
      .block-bordeaux { fill: #8b1a2b; }
      .block-royal { fill: #2748c4; }
      .block-green { fill: #1a5c3a; }
      .sub { fill: #f6f1e6; stroke: #1a2b5e; stroke-width: 2; }
      .title-w { font: 700 32px Georgia, 'Times New Roman', serif; fill: #ffffff; text-anchor: middle; }
      .title-wl { font: 700 38px Georgia, 'Times New Roman', serif; fill: #ffffff; text-anchor: middle; }
      .body-w { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .small-w { font: italic 400 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; fill-opacity: 0.9; text-anchor: middle; }
      .title-n { font: 700 28px Georgia, 'Times New Roman', serif; fill: #1a2b5e; text-anchor: middle; }
      .body-n { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #1a2b5e; text-anchor: middle; }
      .small-n { font: italic 400 22px 'Segoe UI', Arial, sans-serif; fill: #1a2b5e; text-anchor: middle; }
      .tag-b { font: 700 22px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #8b1a2b; text-anchor: middle; }
      .tag-g { font: 700 22px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #1a5c3a; text-anchor: middle; }
      .tag-o { font: 700 22px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #8a6d12; text-anchor: middle; }
      .arrow { stroke: #1a2b5e; stroke-width: 8; fill: none; }
      .arrow-gold { stroke: #b8972a; stroke-width: 8; fill: none; }
      .arrow-b { stroke: #8b1a2b; stroke-width: 6; fill: none; stroke-dasharray: 14 10; }
      .arrow-head { fill: #1a2b5e; }
      .arrow-head-g { fill: #b8972a; }
      .arrow-head-b { fill: #8b1a2b; }
      .legend { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #1a2b5e; }
      .divider-w { stroke: #ffffff; stroke-opacity: 0.35; stroke-width: 2; }
      .cross { stroke: #8b1a2b; stroke-width: 7; stroke-linecap: round; }
    </style>
    <marker id="head" markerWidth="4" markerHeight="4" refX="1" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L4,2 L0,4 Z" class="arrow-head"/>
    </marker>
    <marker id="headg" markerWidth="4" markerHeight="4" refX="1" refY="2" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L4,2 L0,4 Z" class="arrow-head-g"/>
    </marker>
    <marker id="headb" markerWidth="4" markerHeight="4" refX="1" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L4,2 L0,4 Z" class="arrow-head-b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <!-- Bandeaux de colonnes -->
  <line class="rule" x1="60" y1="62" x2="110" y2="62"/>
  <text class="section" x="230" y="70">CLIENTS</text>
  <line class="rule" x1="350" y1="62" x2="400" y2="62"/>

  <line class="rule" x1="520" y1="62" x2="570" y2="62"/>
  <text class="section" x="780" y="70">PASSERELLES</text>
  <line class="rule" x1="990" y1="62" x2="1040" y2="62"/>

  <line class="rule" x1="1180" y1="62" x2="1230" y2="62"/>
  <text class="section" x="1360" y="70">SERVICES</text>
  <line class="rule" x1="1490" y1="62" x2="1540" y2="62"/>

  <!-- Clients -->
  <rect class="block-navy" x="60" y="120" width="340" height="780" rx="4"/>
  <text class="title-wl" x="230" y="190">Clients</text>
  <line class="divider-w" x1="90" y1="225" x2="370" y2="225"/>
  <rect x="90" y="255" width="280" height="76" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text class="body-w" x="230" y="302">Outlook</text>
  <rect x="90" y="347" width="280" height="76" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text class="body-w" x="230" y="394">Outlook web</text>
  <rect x="90" y="439" width="280" height="76" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text class="body-w" x="230" y="486">ActiveSync</text>
  <rect x="90" y="531" width="280" height="76" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text class="body-w" x="230" y="578">API REST</text>
  <rect x="90" y="623" width="280" height="76" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text class="body-w" x="230" y="670">Teams</text>
  <rect x="90" y="715" width="280" height="76" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text class="body-w" x="230" y="762">OneDrive</text>

  <!-- Gestion du trafic -->
  <rect class="block-green" x="520" y="120" width="520" height="90" rx="4"/>
  <text class="title-w" x="780" y="160">Gestion du trafic</text>
  <text class="small-w" x="780" y="193">détecte les serveurs muets, redirige</text>
  <line class="arrow" x1="780" y1="210" x2="780" y2="232" marker-end="url(#head)"/>

  <!-- Passerelle primaire -->
  <rect class="block-gold" x="520" y="260" width="520" height="380" rx="4"/>
  <text class="title-wl" x="780" y="318">Passerelle primaire</text>
  <text class="small-w" x="780" y="354">milliers d'unités de capacité</text>
  <rect class="sub" x="550" y="390" width="130" height="150" rx="4"/>
  <text class="title-n" x="615" y="458">Région</text>
  <text class="title-n" x="615" y="494">1</text>
  <rect class="sub" x="715" y="390" width="130" height="150" rx="4"/>
  <text class="title-n" x="780" y="458">Région</text>
  <text class="title-n" x="780" y="494">2</text>
  <rect class="sub" x="880" y="390" width="130" height="150" rx="4"/>
  <text class="title-n" x="945" y="458">Région</text>
  <text class="title-n" x="945" y="494">3</text>
  <!-- Cloisons -->
  <line x1="697" y1="375" x2="697" y2="560" stroke="#1a2b5e" stroke-width="12" stroke-linecap="round"/>
  <line x1="862" y1="375" x2="862" y2="560" stroke="#1a2b5e" stroke-width="12" stroke-linecap="round"/>
  <text class="body-w" x="780" y="608" font-weight="700">▲ cloisons ▲</text>

  <!-- Passerelle alternative -->
  <rect class="block-royal" x="520" y="700" width="520" height="200" rx="4"/>
  <text class="title-wl" x="780" y="780">Passerelle alternative</text>
  <text class="small-w" x="780" y="822">indépendante et hétérogène</text>
  <text class="small-w" x="780" y="856">portait Teams jusqu'au 12 nov.</text>

  <!-- Flèches clients vers passerelles -->
  <line class="arrow" x1="400" y1="450" x2="490" y2="450" marker-end="url(#head)"/>
  <line class="arrow" x1="400" y1="800" x2="490" y2="800" marker-end="url(#head)"/>

  <!-- Exchange Online -->
  <rect class="block-bordeaux" x="1180" y="260" width="360" height="220" rx="4"/>
  <text class="title-wl" x="1360" y="345">Exchange Online</text>
  <line class="divider-w" x1="1210" y1="378" x2="1510" y2="378"/>
  <text class="small-w" x="1360" y="420">passerelle primaire</text>
  <text class="small-w" x="1360" y="452">uniquement</text>
  <line class="arrow" x1="1040" y1="370" x2="1150" y2="370" marker-end="url(#head)"/>
  <!-- Pas de bascule -->
  <line class="cross" x1="1345" y1="500" x2="1375" y2="530"/>
  <line class="cross" x1="1375" y1="500" x2="1345" y2="530"/>
  <text class="tag-b" x="1360" y="568">PAS DE BASCULE</text>
  <text class="tag-b" x="1360" y="596">POSSIBLE</text>

  <!-- Teams, SharePoint, OneDrive, Office -->
  <rect class="block-green" x="1180" y="640" width="360" height="260" rx="4"/>
  <text class="title-w" x="1360" y="712">Teams</text>
  <text class="title-w" x="1360" y="756">SharePoint</text>
  <text class="title-w" x="1360" y="800">OneDrive</text>
  <text class="title-w" x="1360" y="844">Office</text>
  <path class="arrow" d="M1040,600 L1100,600 L1100,700 L1150,700" marker-end="url(#head)"/>
  <line class="arrow" x1="1040" y1="840" x2="1150" y2="840" marker-end="url(#head)"/>
  <!-- Double flèche bascule possible -->
  <line class="arrow-gold" x1="1140" y1="770" x2="1140" y2="745" marker-end="url(#headg)"/>
  <line class="arrow-gold" x1="1140" y1="770" x2="1140" y2="795" marker-end="url(#headg)"/>
  <text class="tag-o" x="1360" y="944">⇅ BASCULE POSSIBLE</text>
</svg>
